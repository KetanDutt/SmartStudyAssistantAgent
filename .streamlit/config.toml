# Streamlit App Configuration
[server]
headless = true
enableCORS = true
enableXsrfProtection = false
maxUploadSize = 50
port = 8501
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1e293b"
font = "sans serif"
